version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: ai_rag_app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - GROQ_API_KEY=ide kell beírnod a groq api kulcsodat idézőjelek nélkül
    depends_on:
      - mongo
    volumes:
      - .:/app

volumes:
  mongo-data:
