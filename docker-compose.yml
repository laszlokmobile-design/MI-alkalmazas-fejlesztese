version: '3.8'

services:
  # 1. A fejlesztői környezetünk (Ebbe lépünk be VS Code-dal)
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11
    volumes:
      # A projekt gyökerét (egy mappával kijjebb) becsatoljuk a konténerbe
      - ../:/workspaces/complex-ai-applications:cached
    # Ez tartja életben a konténert, miközben kódolunk
    command: sleep infinity
    # Megvárjuk, amíg az adatbázis elindul
    depends_on:
      - mongo

  # 2. A MongoDB adatbázis (Háttérszolgáltatás)
  mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  # Ez biztosítja, hogy a DevContainer újraindításakor ne vesszenek el a chat üzenetek
  mongo-data:
